<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11110f" />
    <meta name="description" content="Datenschutzhinweise von Global Audience Pulse." />
    <link rel="canonical" href="https://beko2210.github.io/global-audience-pulse/datenschutz/" />
    <link rel="icon" href="/global-audience-pulse/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const saved = localStorage.getItem('gap-theme')
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
      } catch {}
    </script>
    <title>Datenschutz – Global Audience Pulse</title>
  </head>
  <body data-legal-page="datenschutz">
    <div id="root"></div>
    <script type="module" src="/src/legal-main.tsx"></script>
  </body>
</html>
