name: Deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  deploy:
    needs: checks
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      main_asset: ${{ steps.asset.outputs.main }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-data.mjs
      - run: npm run validate:snapshot
      - run: npm run build
      # The entry chunk's hashed name identifies this build; smoke-live waits until Pages serves it.
      - id: asset
        run: echo "main=$(grep -o 'assets/main-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
  smoke-live:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Right after a deploy the Pages CDN can still serve the previous index.html (old asset hashes → 404s).
      - name: Wait until the new build is live
        run: |
          for i in $(seq 1 36); do
            if curl -fsS "${E2E_BASE_URL}?cb=$(date +%s)" | grep -q "${{ needs.deploy.outputs.main_asset }}"; then
              echo "live after $((i * 5)) s"; exit 0
            fi
            sleep 5
          done
          echo "new build not live after 180 s"; exit 1
      - run: npx playwright test e2e/smoke.spec.ts e2e/data.spec.ts e2e/layout.spec.ts
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deployed-smoke-report
          path: playwright-report
          if-no-files-found: ignore
