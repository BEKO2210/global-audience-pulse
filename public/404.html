<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Seite nicht gefunden – Global Audience Pulse</title>
    <link rel="icon" href="/global-audience-pulse/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark light;
        --paper: #11110f;
        --ink: #f3efe6;
        --muted: #aaa69a;
        --link: #9fc5bf;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --paper: #f4f0e7;
          --ink: #201f1b;
          --muted: #67645d;
          --link: #286c68;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 24px 16px;
      }
      h1 {
        font:
          400 40px/1.05 Georgia,
          serif;
        margin: 16px 0 12px;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--link);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/global-audience-pulse/favicon.svg" alt="" width="40" height="40" />
      <h1>Diese Seite gibt es nicht.</h1>
      <p>Die Adresse ist falsch oder die Seite wurde verschoben.</p>
      <p><a href="/global-audience-pulse/">Zur Weltuhr</a></p>
    </main>
  </body>
</html>
