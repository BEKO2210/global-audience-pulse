    <meta name="theme-color" content="#11110f" />
    <script>
      try {
        const saved = localStorage.getItem('gap-theme')
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f4f0e7' : '#11110f'
      } catch {}
      // Language (T-065), same rule as src/i18n/locale.ts: ?lang= > saved choice > system language.
      try {
        let lang = new URLSearchParams(location.search).get('lang')
        if (lang !== 'de' && lang !== 'en') lang = localStorage.getItem('gap-lang')
        if (lang !== 'de' && lang !== 'en')
          lang = String((navigator.languages || [])[0] || navigator.language || '')
            .toLowerCase()
            .startsWith('de')
            ? 'de'
            : 'en'
        document.documentElement.lang = lang
      } catch {}
    </script>
