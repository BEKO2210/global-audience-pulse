<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11110f" />
    <script>
      try {
        const saved = localStorage.getItem('gap-theme')
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f4f0e7' : '#11110f'
      } catch {}
    </script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          ;(window.plausible.q = window.plausible.q || []).push(arguments)
        }
    </script>
    <script
      defer
      data-domain="beko2210.github.io"
      src="https://stats.it-handwerk-stuttgart.de/js/script.tagged-events.outbound-links.file-downloads.js"
    ></script>
    <meta
      name="description"
      content="Global Audience Pulse zeigt live, wo deine Community wach ist – und wann dein nächster Post wirkt."
    />
    <meta property="og:title" content="Global Audience Pulse" />
    <meta property="og:description" content="Die Live-Weltuhr für Creator." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/global-audience-pulse/og-image.png" />
    <link rel="canonical" href="https://beko2210.github.io/global-audience-pulse/" />
    <link rel="icon" href="/global-audience-pulse/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="/global-audience-pulse/favicon-32x32.png"
      sizes="32x32"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="/global-audience-pulse/apple-touch-icon.png" />
    <title>Global Audience Pulse</title>
  </head>
  <body>
    <div id="root">
      <!--
      Static first paint (replaced by React on mount): header + hero headline, so the LCP text paints
      before the JS bundle has run. Keep markup/classes in sync with Header and the hero in App.tsx.
    -->
      <div id="top" class="app-shell">
        <header class="site-header">
          <a class="wordmark" href="#top" aria-label="Global Audience Pulse Start"
            ><img alt="" width="32" height="32" src="/global-audience-pulse/favicon.svg" /><span
              >Global Audience<br />Pulse</span
            ></a
          >
        </header>
        <main>
          <div class="hero">
            <div class="hero-copy">
              <p class="eyebrow">Aktuelles Publikumsradar</p>
              <h1>Jetzt posten oder warten?</h1>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
