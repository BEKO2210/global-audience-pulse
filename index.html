<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11110f" />
    <script>
      try {
        const saved = localStorage.getItem('gap-theme')
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f4f0e7' : '#11110f'
      } catch {}
    </script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          ;(window.plausible.q = window.plausible.q || []).push(arguments)
        }
    </script>
    <script
      defer
      data-domain="beko2210.github.io"
      src="https://stats.it-handwerk-stuttgart.de/js/script.tagged-events.outbound-links.file-downloads.js"
    ></script>
    <meta
      name="description"
      content="Global Audience Pulse zeigt live, wo deine Community wach ist – und wann dein nächster Post wirkt."
    />
    <meta property="og:title" content="Global Audience Pulse" />
    <meta property="og:description" content="Die Live-Weltuhr für Creator." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/global-audience-pulse/og-image.png" />
    <link rel="canonical" href="https://beko2210.github.io/global-audience-pulse/" />
    <link rel="icon" href="/global-audience-pulse/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="/global-audience-pulse/favicon-32x32.png"
      sizes="32x32"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="/global-audience-pulse/apple-touch-icon.png" />
    <title>Global Audience Pulse</title>
  </head>
  <body>
    <div id="root">
      <!--
      Static first paint (replaced by React on mount): header + hero headline, so the LCP text paints
      before the JS bundle has run. Keep markup/classes in sync with Header/Wordmark (LogoMark.tsx) and the hero in App.tsx; the logo
      and name animations start here and React continues them via --elapsed.
    -->
      <div id="top" class="app-shell">
        <header class="site-header">
          <a class="wordmark" href="#top" aria-label="Global Audience Pulse Start"
            ><svg
              class="logo-mark has-intro"
              viewBox="0 0 64 64"
              aria-hidden="true"
              focusable="false"
            >
              <rect width="64" height="64" rx="14" fill="#11110f" />
              <g fill="none" stroke="#f3efe6">
                <circle class="logo-draw" cx="32" cy="32" r="20" stroke-width="3" pathLength="1" />
                <g class="logo-meridians">
                  <ellipse class="logo-meridian" style="--i: 0" cx="32" cy="32" rx="20" ry="20" />
                  <ellipse class="logo-meridian" style="--i: 1" cx="32" cy="32" rx="20" ry="20" />
                  <ellipse class="logo-meridian" style="--i: 2" cx="32" cy="32" rx="20" ry="20" />
                </g>
                <path
                  class="logo-draw logo-equator"
                  d="M13 32h38"
                  stroke-width="2"
                  pathLength="1"
                />
              </g>
              <path
                class="logo-draw logo-pulse"
                d="M7 35h13l5-10 7 18 6-13 4 5h15"
                fill="none"
                stroke="#f08a59"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
                pathLength="1"
              />
              <path
                class="logo-beat"
                d="M7 35h13l5-10 7 18 6-13 4 5h15"
                fill="none"
                stroke="#fff7ef"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                pathLength="100"
              /></svg
            ><span class="wordmark-text has-intro"
              ><span class="wm-word" style="--w: 0">Global</span>
              <span class="wm-word" style="--w: 1">Audience</span><br /><span
                class="wm-word"
                style="--w: 2"
                >Pulse</span
              ></span
            ></a
          >
        </header>
        <main>
          <div class="hero">
            <div class="hero-copy">
              <p class="eyebrow">Aktuelles Publikumsradar</p>
              <h1>Jetzt posten oder warten?</h1>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
